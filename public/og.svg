<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Lemma — Proof is a muscle. Train it. An independent AMO problem bank with 248 problems, including 40 official Australian AMO questions, and 16 technique guides.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a3b" />
      <stop offset="1" stop-color="#0d2a22" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4efe4" stroke-opacity="0.05" />
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8663a" stop-opacity="0.28" />
      <stop offset="1" stop-color="#e8663a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1010" cy="120" r="320" fill="url(#glow)" />
  <circle cx="1100" cy="540" r="190" fill="#2f7c60" opacity="0.28" />
  <circle cx="1100" cy="540" r="150" fill="none" stroke="#f4efe4" stroke-opacity="0.08" />

  <!-- Brand mark -->
  <g transform="translate(96 84)">
    <rect width="86" height="86" rx="21" fill="#f4efe4" fill-opacity="0.07" stroke="#f4efe4" stroke-opacity="0.2" />
    <path d="M23 63 43 20l20 43" fill="none" stroke="#f4efe4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M32 48h22" stroke="#f4efe4" stroke-width="6" stroke-linecap="round" />
    <circle cx="68" cy="21" r="5.5" fill="#e8663a" />
  </g>

  <text x="204" y="142" fill="#f4efe4" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="62" font-weight="600" letter-spacing="-1.5">Lemma</text>
  <text x="206" y="180" fill="#e8663a" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="4.5">PROOF IS A MUSCLE. TRAIN IT.</text>

  <!-- Headline -->
  <text x="96" y="340" fill="#f4efe4" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="600" letter-spacing="-2">Proof is a muscle.</text>
  <text x="96" y="424" fill="#e8663a" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-style="italic" font-weight="500" letter-spacing="-2">Train it.</text>

  <!-- Supporting line -->
  <text x="96" y="484" fill="#f4efe4" fill-opacity="0.82" font-family="Inter, Arial, sans-serif" font-size="24">248 problems · 40 official AMO questions · 16 technique guides</text>

  <!-- Bottom rule and meta -->
  <line x1="96" y1="536" x2="1104" y2="536" stroke="#f4efe4" stroke-opacity="0.16" />
  <text x="96" y="572" fill="#f4efe4" fill-opacity="0.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" letter-spacing="0.5">lemma.pages.dev</text>
  <text x="1104" y="572" text-anchor="end" fill="#f4efe4" fill-opacity="0.44" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="1.6">ALGEBRA · NUMBER THEORY · COMBINATORICS · GEOMETRY</text>

  <!-- Independence note -->
  <text x="96" y="606" fill="#f4efe4" fill-opacity="0.42" font-family="Inter, Arial, sans-serif" font-size="13">An independent AMO-family problem bank. Not affiliated with any competition organiser.</text>

  <!-- Corner accent -->
  <path d="M1104 84h-58M1104 84v58" fill="none" stroke="#e8663a" stroke-opacity="0.7" stroke-width="2" />
</svg>
