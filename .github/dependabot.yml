version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - typescript
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
