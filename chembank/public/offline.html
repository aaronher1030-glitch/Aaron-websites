<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · ChemBank</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f4f1e8;
        --ink: #141414;
        --muted: #5c5a52;
        --cobalt: #1f3a8a;
        --copper: #b45309;
        --rule: #d8d2c4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(100%, 520px);
        padding: 30px 28px;
        background: #fffdf7;
        border: 2px solid var(--ink);
        border-radius: 14px;
        box-shadow: 5px 5px 0 rgba(20, 20, 20, 0.16);
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .eyebrow {
        margin-bottom: 10px;
        color: var(--copper);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 2.8rem);
        line-height: 1.05;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        margin-top: 10px;
        padding: 10px 18px;
        background: var(--cobalt);
        border-radius: 10px;
        color: #f4f1e8;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--copper);
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121212;
          --ink: #f2eee4;
          --muted: #b7b0a3;
          --cobalt: #8ba3ff;
          --rule: #33312c;
        }
        main {
          background: #1a1a18;
          border-color: var(--ink);
          box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.5);
        }
        a {
          color: #121212;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ChemBank · offline</p>
      <h1>You are offline</h1>
      <p>
        This page was not cached yet. Open ChemBank once while online, then the
        bank and reference pages will load from your device on later visits.
      </p>
      <p>Your saved progress stays in this browser. Nothing was lost.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
